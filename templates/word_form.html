{% extends "base.html" %}

{% block content %}

{% if word %}
<h2>Edit Word</h2>
{% else %}
<h2>Add New Word</h2>
{% endif %}

<form method="POST">
    <p>
        <label>English Word</label>
        <input type="text" name="english"
               value="{{ word.english if word else '' }}" required>
    </p>
    <p>
        <label>Portuguese Translation</label>
        <input type="text" name="portuguese"
               value="{{ word.portuguese if word else '' }}" required>
    </p>
    <p>
        <label>Category</label>
        <input type="text" name="category"
               value="{{ word.category if word else '' }}"
               placeholder="e.g. Greetings, Food, Numbers" required>
    </p>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('words') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

{% endblock %}
